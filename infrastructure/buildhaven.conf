server {
        server_name buildhaven.cc www.buildhaven.cc;

        location / {
                proxy_pass http://127.0.0.1:3000;

                proxy_http_version 1.1;
                proxy_set_header Connection "";

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_read_timeout 60s;
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
        }

        limit_req zone=one burst=20 nodelay;

        listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/buildhaven.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/buildhaven.cc/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.buildhaven.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = buildhaven.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

        listen 80;
        server_name buildhaven.cc www.buildhaven.cc;
        return 301 https://buildhaven.cc$request_uri;
}