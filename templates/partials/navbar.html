<nav class="navbar">
    <ul class="navbar-group navbar-left">
        <li>
            <a href="/" class="navbar-link">
                <img
                    src="/media/icons/{{ crate::constants::icons::HOME }}"
                    alt="Home"
                    class="navbar-icon"
                >
                Home
            </a>
        </li>
        <li>
            <a href="/blog" class="navbar-link">
                <img
                    src="/media/icons/{{ crate::constants::icons::BLOG }}"
                    alt="Blog"
                    class="navbar-icon"
                >
                Blog
            </a>
        </li>
        <li>
            <a href="/resume" class="navbar-link">
                <img
                    src="/media/icons/{{ crate::constants::icons::RESUME }}"
                    alt="Resume"
                    class="navbar-icon"
                >
                Resume
            </a>
        </li>
        <li>
            <a href="/contact" class="navbar-link">
                <img
                    src="/media/icons/{{ crate::constants::icons::CONTACT }}"
                    alt="Contact"
                    class="navbar-icon"
                >
                Contact
            </a>
        </li>
        <li class="dropdown" data-dropdown>
            <button class="dropdown-button util-icon">
                <img src="/media/icons/{{ crate::constants::icons::SOFTWARE }}" alt="More" class="navbar-icon">
                Docs
            </button>

            <ul class="dropdown-menu">
                {% for doc in base.docs %}
                <li>
                    <a href="/docs/{{ doc.slug }}" class="dropdown-link">
                        {{ doc.title }}
                    </a>
                </li>
                {% endfor %}
            </ul>
        </li>
    </ul>

    <ul class="navbar-group navbar-right">
        <!-- Login / Register -->
        <li>
            <a href="/login" class="navbar-link util-icon">
                <img src="/media/icons/{{ crate::constants::icons::LOGIN }}" alt="Login" class="navbar-icon">
            </a>
        </li>

        <!-- Theme -->
        <li class="dropdown" data-dropdown>
            <button class="dropdown-button util-icon">
                <img src="/media/icons/{{ crate::constants::icons::THEME }}" alt="Theme" class="navbar-icon">
            </button>

            <ul class="dropdown-menu">
                {% for theme in base.themes %}
                <li>
                    <button
                        class="dropdown-link"
                        data-theme="{{ theme.id }}"
                    >
                        <img
                            src="/media/themes/{{ theme.icon }}"
                            alt="{{ theme.name }}"
                            class="navbar-icon"
                        >

                        {{ theme.name }}
                    </button>
                </li>
                {% endfor %}
            </ul>
        </li>
    </ul>
</nav>
