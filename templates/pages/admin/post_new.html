{% extends "base.html" %}

{% block content %}
    <h1>New Post</h1>

    <form method="post" action="/admin/posts">
        <div>
            <label for="title">Title</label>
            <input
                type="text"
                id="title"
                name="title"
                required
            >
        </div>

        <div>
            <label for="content">Content</label>
            <textarea
                id="content"
                name="content"
                rows="20"
                required
                class="form-field"
            ></textarea>
        </div>

        <button type="submit">Create Post</button>
    </form>
{% endblock %}
