{% extends "base.html" %}

{% block content %}
    <h1>Edit Post</h1>

    <form method="post" action="/admin/posts/{{ post.id }}">
        <div>
            <label for="title">Title</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ post.title }}"
                required
            >
        </div>

        <div>
            <label for="content">Content</label>
            <textarea
                id="content"
                name="content"
                rows="20"
                required
            >{{ post.content }}</textarea>
        </div>

        <button type="submit">Save Changes</button>
    </form>
{% endblock %}
