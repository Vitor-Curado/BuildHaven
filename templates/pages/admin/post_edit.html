{% extends "base.html" %}

{% block content %}
    <header>
       <h1>Edit Post</h1>
        <p><strong> Status: </strong> {{post.status}} </p> 

        {% if let Some(published_at) = post.published_at %}
            <p><strong> Published: </strong> <time datetime="{{ published_at }}"> {{ published_at }} </time> </p>
        {% endif %}

        <p> <a href="/admin/posts"> <= Back to Posts </a> </p>
    </header>
    
    <form class="form" method="post" action="/admin/posts/{{ post.id }}">
        <div class="form-group">
            <label class="form-label" for="title"> Title </label>
            <input
                class="form-field"
                type="text"
                id="title"
                name="title"
                value="{{ post.title }}"
                required
            >
        </div>
        <div class="form-group">
            <label class="form-label" for="seo_title"> SEO Title </label>
            <input
                class="form-field"
                type="text"
                id="seo_title"
                name="seo_title"
                value="{{ post.seo_title }}"
                required
            >
        </div>
        <div class="form-group">
            <label class="form-label" for="meta_description"> Meta Description </label>
            <textarea
                class="form-field"
                id="meta_description"
                name="meta_description"
                rows="5"
                required>{{ post.meta_description }}</textarea>
        </div>
        <div class="form-group">
            <label class="form-label" for="content"> Content </label>
            <textarea
                class="form-field"
                id="content"
                name="content"
                rows="20"
                required
            >{{ post.content }}</textarea>
        </div>
        <div class="form-actions">
            <button type="submit"> Save Changes </button>
        </div>
    </form>

    {% if post.status == "published" %}
        <form action="/admin/posts/{{ post.id }}/unpublish" method="post"> <button type="submit"> Unpublish </button> </form>
    {% else %}
        <form action="/admin/posts/{{ post.id }}/publish" method="post"> <button type="submit"> Publish </button> </form>
    {% endif %}

    <form action="/admin/posts/{{ post.id }}/delete" method="post"> <button type="submit"> Delete </button> </form>
{% endblock %}
