{% extends "base.html" %}

{% block content %}
<article class="blog-post">
    <header class="blog-post-header">
        <h1>{{ post.title }}</h1>

        {% if let Some(published_at) = post.published_at %}
            <time datetime="{{ post.published_at }}">
                {{ post.published_at }}
            </time>
        {% endif %}
    </header>

    <div class="blog-post-content">
        {{ content_html }}
    </div>
</article>
{% endblock %}
